# Nginx reverse proxy untuk produksi.
# Kunci WebSocket: header Upgrade/Connection harus diteruskan dengan benar,
# kalau tidak koneksi /api/v1/ws akan gagal handshake.

# $connection_upgrade = "upgrade" bila request minta upgrade (WebSocket),
# selain itu "close". Ini menggantikan "Connection keep-alive" yang salah
# untuk WS.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Batas ukuran upload (design item / chat file). Sesuaikan bila perlu.
    client_max_body_size 20m;

    location / {
        proxy_pass         http://app:8888;
        proxy_http_version 1.1;

        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket bisa idle lama — jangan putus koneksi chat yang diam.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}
