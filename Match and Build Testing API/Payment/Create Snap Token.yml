info:
  name: Create Snap Token
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/payment/{{order_id}}/snap-token"
  headers:
    - name: Authorization
      value: "Bearer {{access_token}}"
  auth: inherit

script:
  post-response:
    - script: |-
        if (res.status === 201) {
          const body = res.body;
          if (body.data) {
            bru.setEnvVar("payment_id", body.data.payment_id || "");
            bru.setEnvVar("midtrans_order_id", body.data.midtrans_order_id || "");
            bru.setEnvVar("snap_token", body.data.snap_token || "");
            bru.setEnvVar("snap_redirect_url", body.data.redirect_url || "");
          }
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
