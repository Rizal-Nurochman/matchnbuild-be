info:
  name: Get Payment Status
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/payment/{{order_id}}/status"
  headers:
    - name: Authorization
      value: "Bearer {{access_token}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
