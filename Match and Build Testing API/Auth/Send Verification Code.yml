info:
  name: Send Verification Code
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/auth/send-verification-email"
  body:
    type: json
    data: |-
      {
        "email": "{{email}}"
      }
  auth: inherit

runtime:
  variables:
    - name: base_url
      value: http://localhost:8888/api/v1

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
