info:
  name: Update User
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{base_url}}/user/{{user_id}}"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
  body:
    type: json
    data: |-
      {
        "name": "Updated Name"
      }
  auth: inherit

runtime:
  variables:
    - name: base_url
      value: http://localhost:8888/api/v1

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
