info:
  name: Create Item Design
  type: http
  seq: 6

http:
  method: POST
  url: "{{base_url}}/design-item"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "title": "Modern Minimalist House",
        "description": "Rumah modern minimalis dengan pencahayaan alami dan desain elegan",
        "style": "Modern",
        "category": "",
        "land_area_min": ,
        "land_area_max": ,
        "building_area": ,
        "num_floors": ,
        "num_bedrooms": ,
        "room_type": "",
        "room_area": ,
        "estimated_budget": ,
        "price_start_from": ,
        "image_url": "https://example.com/image.jpg",
        "feature_ids": [
          "feature-1",
          "feature-2",
          "feature-3"
        ]
      }
  auth: inherit

runtime:
  variables:
    - name: base_url
      value: http://localhost:8888/api/v1

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
