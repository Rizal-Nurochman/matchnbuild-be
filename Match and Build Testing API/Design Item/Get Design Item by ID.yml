info:
  name: Get Design Item by ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/design-items/{{design_item_id}}"
  auth: inherit

runtime:
  variables:
    - name: base_url
      value: http://localhost:8888/api/v1

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
