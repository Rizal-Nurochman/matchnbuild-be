services:
  app:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.prod
    container_name: matchnbuild-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ML_SERVICE_URL: http://ml:8000
    volumes:
      - ./.env:/app/.env:ro
      - app-assets:/app/assets
      - app-logs:/app/config/logs
    command: sh -c "/app/server --migrate:run && /app/server"
    networks:
      - app-network

  ml:
    build:
      context: ../matchnbuild-ml
    container_name: matchnbuild-ml
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASS}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
      PORT: 8000
    networks:
      - app-network

  caddy:
    image: caddy:2-alpine
    container_name: matchnbuild-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    networks:
      - app-network

volumes:
  app-assets:
  app-logs:
  caddy-data:
  caddy-config:

networks:
  app-network:
    driver: bridge
